# Dot Car Derby - Docker Compose Configuration
# This file sets up the complete development environment

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dot-derby-postgres
    environment:
      POSTGRES_USER: dotuser
      POSTGRES_PASSWORD: dotpass_dev_only
      POSTGRES_DB: dot_car_derby_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotuser -d dot_car_derby_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dot-derby-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dot-derby-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dot-derby-network

  # pgAdmin (Database Management GUI) - Optional
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dot-derby-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dotcarderby.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dot-derby-network
    profiles:
      - tools  # Only starts when using --profile tools

  # Redis Commander (Redis Management GUI) - Optional
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dot-derby-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - dot-derby-network
    profiles:
      - tools  # Only starts when using --profile tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  dot-derby-network:
    driver: bridge

# Usage:
# 
# Start core services (postgres + redis):
#   docker-compose up -d
#
# Start with management tools (pgadmin + redis-commander):
#   docker-compose --profile tools up -d
#
# Stop all services:
#   docker-compose down
#
# Remove all data (fresh start):
#   docker-compose down -v
#
# View logs:
#   docker-compose logs -f
#
# Access pgAdmin:
#   http://localhost:5050
#   Email: admin@dotcarderby.local
#   Password: admin
#
# Access Redis Commander:
#   http://localhost:8081
